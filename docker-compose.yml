services:
  postgres:
    image: postgres:16-alpine
    container_name: dentasmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentasmart
      POSTGRES_PASSWORD: dentasmart
      POSTGRES_DB: dentasmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dentasmart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
